# persian_diacrit — Persian/Farsi diacritization (haraqat + ezafe detection).
#
# Persian uses Arabic script with short vowels normally omitted.
# Additionally, the ezafe (unwritten /e/ connective) is uniquely Persian.
#
# Architecture: 6L/384d Transformer encoder + haraqat head + ezafe head.
# Same family as rababa Arabic encoder, adapted for Persian characters.

name: persian_diacrit
description: Persian/Farsi diacritization with ezafe detection
kind: persian
tier: 1

data:
  root: /datasets/persian-diacritized
  max_len: 200

model:
  dim: 384
  layers: 6
  heads: 6
  ff_dim: 1536
  dropout: 0.1
  max_len: 200
  batch_size: 32

train:
  epochs: 15
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  grad_clip: 1.0
  fp16: true
  label_smoothing: 0.1

eval:
  v0.1.0_max_der: 0.15
  v0.5.0_max_der: 0.08
  v1.0.0_max_der: 0.05
